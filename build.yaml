overview: "Hardcover.app metadata and cover provider for Jellyfin book libraries"
description: >
  Fetches book metadata (description, series and position, release date, genres, moods, rating,
  publisher, ISBN, contributors) and cover images from Hardcover.app, plus author biographies and
  photos. Requires a free Hardcover API token with the read:catalog scope.
category: "Metadata"
owner: "SirBiggin"
artifacts:
  - "Jellyfin.Plugin.JellyCover.dll"
changelog: |-
  - Pause all requests when Hardcover's daily limit is hit (one warning instead of hundreds of 429 lines)
  - Never fall back to a title search when the API is unavailable; items are left untouched for a later refresh
  - Read metadata.opf next to the book (Calibre) for the exact title, author, ISBN, ASIN and series
  - Look up books by ASIN; score search hits with the author; handle truncated "Title - Author" file names
